name: 功能请求 / Feature request
description: 提出你想要的功能。 / Feature request.
labels: [ Feature ]
title: "[功能请求] "
body:
  - type: markdown
    attributes:
      value: |
        感谢您给 QAuxiliary 提出建议！
        为了使我们更好地帮助你，请提供以下信息。

  - type: "input"
    id: version
    attributes:
      label: "QQ(TIM) 版本 / QQ(TIM) Version"
      description: "QQ(TIM) 版本 / QQ(TIM) Version"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 为什么你认为需要此功能
    validations:
      required: true

  - type: textarea
    id: related-feature
    attributes:
      label: 联系到哪些已经存在的 bug 或者功能
      description: 如果没有留空即可
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: 具体功能需要 / Detailed features requirements
    validations:
      required: true

  - type: checkboxes
    id: latest
    attributes:
      label: 其他要求 / Other Requirements
      options:
        - label: 这一 issue 是由自动化程序或 AI 驱动发布的
          # this issue is generated by automation or AI
          # check this if you even not open this issus from web
          required: false
